services:
  postgres:
    container_name: inventory-platform-postgres-fresh
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-inventory_platform}
      POSTGRES_USER: ${POSTGRES_USER:-inventory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inventory_dev}
    ports:
      - "${POSTGRES_PORT:-5435}:5432"
    volumes:
      - inventory-platform-postgres-fresh:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-inventory} -d ${POSTGRES_DB:-inventory_platform}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  inventory-platform-postgres-fresh:
    name: inventory-platform-postgres-fresh
